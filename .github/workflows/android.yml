# Compile l'application Android à chaque push et publie l'APK.
# Secrets à ajouter dans GitHub → Settings → Secrets and variables → Actions :
#   SUPABASE_URL, SUPABASE_ANON_KEY  (sans eux, l'app démarre en mode démo)
name: Android APK
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pour publier l'APK dans « Releases »
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compiler l'APK
        working-directory: android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AfricansBiz-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publier la version (téléchargement direct)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AfricansBiz 1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
